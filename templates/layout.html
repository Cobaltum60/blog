<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/google-sans-flex@5.3.2/index.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top-app-bar">
    <div class="app-bar-inner">
      <a href="/" class="brand" aria-label="首页">
        <span>C</span><span>o</span><span>b</span><span>a</span><span>l</span><span>t</span><span>u</span><span>m</span><span>'</span><span>s</span><span>&nbsp;</span><span>B</span><span>l</span><span>o</span><span>g</span>
      </a>
      <nav>
        <ul class="nav-list">
          <li><a href="/" {{isHome}}>首页</a></li>
          <li><a href="/archive.html" {{isArchive}}>归档</a></li>
          <li><a href="#">RSS</a></li>
          <li><button id="theme-toggle" class="theme-btn">☀</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="layout">
    <section class="posts-column">
      {{content}}
    </section>

    <aside class="sidebar">
      <div class="sidebar-card">
        <div class="profile-row">
          <div class="avatar" style="background: var(--google-blue);"></div>
          <div class="profile-name">Cobaltum</div>
        </div>
        <p class="profile-bio">独立开发者、写作者。喜欢在安静的地方写代码，记录关于设计、前端与生活的片段。</p>
      </div>
      <div class="sidebar-card">
        <h3 class="sidebar-title">标签</h3>
        <div class="tag-row">
          <span class="tag-chip">前端</span>
          <span class="tag-chip">CSS</span>
          <span class="tag-chip">随笔</span>
        </div>
      </div>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    hljs.highlightAll();
    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        const targetId = this.getAttribute('data-target');
        const codeElement = document.getElementById(targetId);
        if (!codeElement) return;
        const codeText = codeElement.innerText;
        const showCopied = () => {
          this.classList.add('copied');
          const originalSVG = this.innerHTML;
          this.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
          setTimeout(() => { this.classList.remove('copied'); this.innerHTML = originalSVG; }, 1800);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(codeText).then(showCopied).catch(() => { fallbackCopy(codeText); showCopied(); });
        } else { fallbackCopy(codeText); showCopied(); }
        function fallbackCopy(text) {
          const textarea = document.createElement('textarea');
          textarea.value = text; textarea.style.position = 'fixed'; textarea.style.opacity = '0';
          document.body.appendChild(textarea); textarea.select(); document.execCommand('copy'); document.body.removeChild(textarea);
        }
      });
    });
  </script>
  <script src="/static/app.js"></script>
</body>
</html>
