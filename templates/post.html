<article class="post">
  <div class="post-header">
    <h1>{{title}}</h1>
    <div class="post-meta">
      <span>发布于 {{date}}</span>
      <span>·</span>
      <span>☕ {{readTime}} min read</span>
    </div>
  </div>
  <div class="post-tags" style="margin-bottom: 32px; justify-content: center;">{{tags}}</div>
  <div class="post-content">{{content}}</div>
</article>
