<div class="progress-bar" id="progress-bar"></div>

<div class="post-layout">
  <!-- 左：正文 -->
  <div>
    <article class="post-detail glass-card">
      <nav class="breadcrumb" aria-label="面包屑">
        <a href="/"><i class="fa-solid fa-house"></i> Home</a>
        <i class="fa-solid fa-chevron-right"></i>
        <a href="/posts/">Posts</a>
        <i class="fa-solid fa-chevron-right"></i>
        <span class="current">{{title}}</span>
      </nav>

      <header class="post-detail-header">
        <h1 class="post-detail-title">{{title}}</h1>
        <div class="post-detail-meta">
          <span><i class="fa-regular fa-calendar"></i> {{date}}</span>
          <span><i class="fa-regular fa-clock"></i> {{readTime}} min read</span>
          <span><i class="fa-solid fa-pen-nib"></i> {{wordCount}} 字</span>
        </div>
        <div class="post-detail-tags">
          {{tags}}
        </div>
      </header>

      <div class="post-detail-content" id="post-content">
        {{content}}
      </div>

      <!-- 上一篇 / 下一篇 -->
      {{post_nav}}

      <footer class="post-detail-footer">
        <a href="/posts/" class="btn btn-outline">
          <i class="fa-solid fa-arrow-left"></i> 返回文章列表
        </a>
      </footer>

      <!-- 评论区 -->
      <section class="comments-section">
        <h3 class="comments-title">
          <i class="fa-regular fa-comments"></i> Comments
        </h3>
        <div id="giscus-container" class="giscus-container"></div>
      </section>
    </article>
  </div>

  <!-- 右：TOC -->
  <aside class="toc glass-card" id="toc" aria-label="目录">
    <div class="toc-head">目录</div>
    <ul class="toc-list" id="toc-list"></ul>
  </aside>
</div>

<!-- 返回顶部 -->
<button class="back-top" id="back-top" aria-label="返回顶部">
  <i class="fa-solid fa-arrow-up"></i>
</button>
