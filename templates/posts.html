<article class="post-detail active">
  <div class="post-detail-header">
    <h1 class="post-detail-title">{{title}}</h1>
  </div>
  <div class="post-card-meta" style="margin-bottom: 2rem;">
    <span>{{date}}</span>
    <span class="chip">{{category}}</span>
  </div>
  
  <div class="markdown-body">
    {{content}}
  </div>
  
  <div style="margin-top: 3rem; border-top: 1px solid var(--md-sys-color-outline-variant); padding-top: 1.5rem;">
    <a href="/" style="display: inline-block; padding: 0.5rem 1rem; border: 1px solid var(--md-sys-color-outline-variant); text-decoration: none; color: var(--md-sys-color-on-surface-variant); font-size: 0.875rem;">← 返回首页</a>
  </div>
</article>

<div class="giscus-container" style="margin-top: 2rem; padding: 1.5rem 0; border-top: 1px solid var(--md-sys-color-outline-variant);">
  <script src="https://giscus.app/client.js"
          data-repo="你的GitHub用户名/你的仓库名"
          data-repo-id="你的repo-id"
          data-category="Announcements"
          data-category-id="你的category-id"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="top"
          data-theme="preferred_color_scheme"
          data-lang="zh-CN"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
</div>
