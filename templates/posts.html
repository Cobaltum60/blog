<article class="post-detail">
  <header class="post-detail-header">
    <h1 class="post-detail-title">{{title}}</h1>
    <div class="post-detail-meta">
      <span><i class="fa-regular fa-calendar"></i> {{date}}</span>
      <span><i class="fa-regular fa-clock"></i> {{readTime}} min read</span>
    </div>
    <div class="post-detail-tags">
      {{tags}}
    </div>
  </header>
  
  <div class="post-detail-content">
    {{content}}
  </div>
  
  <footer class="post-detail-footer">
    <a href="/posts/" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> 返回文章列表</a>
  </footer>
  <script src="https://giscus.app/client.js"
        data-repo="Cobaltum60/blog"
        data-repo-id="R_kgDOVW3agQ"
        data-category="Announcements"
        data-category-id="DIC_kwDOVW3agc4DJoYr"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="zh-CN"
        crossorigin="anonymous"
        async>
</script>
</article>
